{% extends "base.html" %}
{% block content %}

<form method="post">
    {% csrf_token %}
    Name:<input type="text" name="name" value="{{ customer.name }}"  required>
    <br><br>
    Email:<input type="email" name="email" value="{{ customer.email }}" required>
    <br><br>
    Phone:<input type="number" name="phone" value="{{ customer.phone }}" required>
    <br><br>
    Address:<input type="text" name="address"  value="{{ customer.address }}" required>
    <br><br>
    <button type="submit">Submit</button>
    <br><br>

</form>








{% endblock %}
