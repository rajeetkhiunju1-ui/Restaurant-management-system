{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<a href="/register/">Register</a>

<form method="post">
    {% csrf_token %}
    Username:<input type="text" name="username" required>
    <br><br>
    Password:<input type="password" name="password" required>
    <br><br>
    <button type="submit">Submit</button>
    <br><br>
</form>
{% if messages %}
    {% for message in messages %}
       <p>{{ message }}</p>
    {% endfor %}
{% endif %}
  
    
{% endblock %}
