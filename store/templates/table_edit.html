{% extends "base.html" %}
{% block content %}


<form method="post">
    {% csrf_token %}
    Table no:<input type="number" name="table_number" value="{{ table.table_number }}" required>
    <br><br>
    Capacity:<input type="number" name="capacity" value="{{ table.capacity }}"  required>
    <br><br>
    <label>Status</label>
    <select name="status">
        <option value="Available" {% if table.status == "Available" %}selected{% endif %}>Available</option>
        <option value="Occupied" {% if table.status == "Occupied" %}selected{% endif %}>Occupied</option>
        <option value="Reserved" {% if table.status == "Reserved" %}selected{% endif %}>Reserved</option>
    </select>
    <button type="submit">Update table</button>
</form>






{% endblock %}
